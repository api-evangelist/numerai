aid: numerai
name: Numerai
description: >-
  Numerai is a San Francisco hedge fund that crowdsources its stock-market trading models from a global
  community of data scientists. Participants download obfuscated, regularized financial datasets, train
  machine-learning models, and submit predictions each weekly round through a single GraphQL API at
  api-tournament.numer.ai. Models are staked with the Ethereum-based NMR token and earn performance-based
  payouts for accurate, original signals. The platform spans Numerai Classic, Numerai Signals
  (bring-your-own stock signals), and Crypto Signals, with official Python tooling (numerapi, numerai-cli,
  numerai-tools) and cloud Compute Prediction Nodes for fully automated round submissions.
